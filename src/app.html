<title>Hifz Recall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone-first single column. Sticky sūrah bar on top, practice sheet in the middle, mode bar fixed to the bottom within thumb reach. */
@font-face{font-family:"KFGQPC Hafs";src:url(data:font/woff2;base64,/*FONT_HAFS*/) format("woff2");font-display:block}
:root{
  --paper:#f3f5f1; --sheet:#ffffff; --ink:#17211d; --muted:#5a6962; --line:#dbe1db;
  --accent:#24508f; --accent-ink:#ffffff; --gold:#94742f; --gold-soft:#f1e7cf;
  --again:#b2443a; --hard:#a26b17; --good:#2b744e; --easy:#2a68a3;
  --s0:#e1e7e1; --s1:#e6c97f; --s2:#7db594; --s3:#2b744e;
  --font-ar:"KFGQPC Hafs","Amiri Quran","Scheherazade New",serif;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  --ar-size:32px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1518; --sheet:#162025; --ink:#e6ece8; --muted:#95a59e; --line:#27353b;
  --accent:#8fb2ec; --accent-ink:#0f1518; --gold:#d6b36c; --gold-soft:#3a3222;
  --again:#e3786d; --hard:#dba24e; --good:#6cc296; --easy:#79aee6;
  --s0:#24313a; --s1:#7d6630; --s2:#3f7a5a; --s3:#6cc296; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1518; --sheet:#162025; --ink:#e6ece8; --muted:#95a59e; --line:#27353b;
  --accent:#8fb2ec; --accent-ink:#0f1518; --gold:#d6b36c; --gold-soft:#3a3222;
  --again:#e3786d; --hard:#dba24e; --good:#6cc296; --easy:#79aee6;
  --s0:#24313a; --s1:#7d6630; --s2:#3f7a5a; --s3:#6cc296; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--line)}
.topbar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.surahbtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:6px 4px;cursor:pointer;text-align:start}
.surahbtn .num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.surahbtn .txt{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.surahbtn .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.surahbtn .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.surahbtn .arn{flex:none;margin-inline-start:auto;font-family:var(--font-ar);font-size:24px;color:var(--gold);line-height:1}
.iconbtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{max-width:720px;margin:0 auto;padding-block:16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;padding:4px 2px;min-width:0}
.nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"] svg{stroke-width:2.3}

.label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.meta{font-size:14px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.btn{min-height:44px;border:1px solid var(--line);background:var(--sheet);padding:8px 16px;border-radius:12px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .btn{padding-inline:8px;font-size:14px;line-height:1.25}
.card.warn{border-color:var(--hard);flex-direction:row;align-items:center;font-size:14px}
.btn.danger{color:var(--again)}
.btn:disabled{opacity:.45;cursor:default}
.pill{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--s0);color:var(--ink)}
.pill[data-s="1"]{background:var(--gold-soft);color:var(--gold)}
.pill[data-s="2"],.pill[data-s="3"]{background:var(--good);color:var(--sheet)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;cursor:pointer;font-size:15px}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper)}
.seg button{border:0;border-inline-start:1px solid var(--line);background:transparent;min-height:40px;padding:6px 4px;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);font-size:14px}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
kbd{font-family:var(--font-ui);font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.6;font-weight:600}
@media (hover:none){kbd{display:none}}

.ar{font-family:var(--font-ar);direction:rtl;text-align:right;font-size:var(--ar-size);line-height:2;word-spacing:.05em;margin:0;overflow-wrap:break-word}
.ar.cue{font-size:calc(var(--ar-size) * .74);color:var(--muted)}
.end{color:var(--gold);white-space:nowrap}
.hz{color:var(--gold)}
.tr{font-size:16px;line-height:1.6;color:var(--muted);margin:0}
.tr.cue{font-style:italic}
.cuebox{border-inline-start:3px solid var(--gold);padding-inline-start:12px;display:flex;flex-direction:column;gap:2px}
.cuebox .label{color:var(--gold)}
.answer{min-height:6em;border:1.5px dashed var(--line);border-radius:14px;padding:8px 14px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.answer.shown{border:0;background:var(--paper)}
.more{font-size:14px;color:var(--muted);text-align:center}
.dock{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);display:flex;flex-direction:column;gap:8px;background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.dock .two{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.grade{min-height:58px;border:1.5px solid var(--line);border-radius:12px;background:var(--sheet);padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:15px}
.grade small{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.grade[data-g="0"]{color:var(--again)}.grade[data-g="1"]{color:var(--hard)}.grade[data-g="2"]{color:var(--good)}.grade[data-g="3"]{color:var(--easy)}
.grade:active{border-color:currentColor}

.ayah{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-bottom:1px solid var(--line)}
.ayah:last-child{border-bottom:0}
.w{border-radius:6px;cursor:pointer}
.w.gap{display:inline-block;min-width:var(--wl,2em);border-bottom:2px dotted var(--gold);color:transparent;line-height:1.3;user-select:none;-webkit-user-select:none;text-align:center}
.w.gap.fl{color:var(--gold)}
.w.peek{background:var(--gold-soft)}
.w.sel{outline:2px solid var(--accent);outline-offset:1px}
.foot{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;justify-content:space-between}
.listen{display:inline-flex;gap:14px;align-items:center;font-size:14px}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:6px 0;font-weight:600;font-size:14px}
.linkbtn.danger{color:var(--again)}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.transport{display:grid;grid-template-columns:60px 1fr 60px;gap:8px}
.transport .btn{min-height:52px;padding:6px}
.transport svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lsa{cursor:pointer;border-radius:12px;padding-inline:8px;margin-inline:-8px}
.lsa.cur{background:var(--gold-soft);background:color-mix(in srgb,var(--gold-soft) 55%,transparent)}
.w.hl{background:var(--gold);color:var(--sheet)}
.pill.turn{background:var(--accent);color:var(--accent-ink)}

.slot{font-family:var(--font-ui);font-size:.7em;display:inline-block;min-width:1.6em;border-bottom:2px solid var(--accent);color:var(--accent);text-align:center;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.slot{animation:none}}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{min-height:64px;border:1.5px solid var(--line);background:var(--sheet);border-radius:14px;cursor:pointer;padding:4px 10px;display:flex;align-items:center;justify-content:center;position:relative;min-width:0}
.opt .ar{font-size:calc(var(--ar-size) * .82);line-height:1.8;text-align:center}
.opt kbd{position:absolute;top:6px;left:8px}
.opt.bad{border-color:var(--again);opacity:.55;cursor:default}
.opt.bad .ar{text-decoration:line-through;text-decoration-color:var(--again)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.empty{display:flex;flex-direction:column;gap:12px}
.empty h2{margin:0;font-size:20px;text-wrap:balance}
.empty p{margin:0;color:var(--muted)}

.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(22px,1fr));gap:4px}
.map button{aspect-ratio:1;border:0;border-radius:5px;background:var(--s0);cursor:pointer;padding:0;font-size:9px;color:transparent;max-width:100%}
.map button[data-s="1"]{background:var(--s1)}.map button[data-s="2"]{background:var(--s2)}.map button[data-s="3"]{background:var(--s3)}
.map button.in{box-shadow:inset 0 0 0 2px var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:12px;height:12px;border-radius:3px;display:inline-block}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list button{width:100%;min-height:48px;display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 4px;cursor:pointer;text-align:start}
.list li:last-child button{border-bottom:0}
.list .n{flex:none;width:32px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;text-align:center}
.list .t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.list .t small{color:var(--muted);font-size:13px}
.list .a{flex:none;font-family:var(--font-ar);font-size:22px;color:var(--gold)}
.list .due{flex:none;font-weight:700;color:var(--again);font-variant-numeric:tabular-nums}
.list button[aria-current="true"]{background:var(--gold-soft);border-radius:10px}

.sheetwrap{position:fixed;inset:0;z-index:40;background:rgba(10,15,14,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);width:100%;max-width:720px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.sheet header h2{margin:0;font-size:18px}
.sheet .body{overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.search{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.range{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;flex-direction:column;gap:4px}
.stepper > div{display:grid;grid-template-columns:44px 1fr 44px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{border:0;background:var(--paper);font-size:20px;cursor:pointer}
.stepper input{border:0;text-align:center;min-width:0;background:var(--sheet);font-variant-numeric:tabular-nums;font-weight:700;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.group{display:flex;flex-direction:column;gap:8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 12px);z-index:50;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:15px;width:max-content;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center}
.toast .ar{font-size:26px;line-height:1.6;color:var(--paper)}
.wc{--font-ar-ui:"Noto Naskh Arabic","Geeza Pro","Segoe UI","Tahoma",sans-serif}
.wc-word{font-family:var(--font-ar);font-size:calc(var(--ar-size) * 1.25);line-height:1.6;text-align:center;margin:0;direction:rtl}
.wc-gloss{margin:0;text-align:center;color:var(--muted);font-size:14px}
.wc-mean{margin:0;text-align:center;font-size:19px;font-weight:600}
.wc-mean small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.ws-mean{color:var(--ink);font-size:16px}
.wc-gloss small,.wc dd small{display:block;color:var(--muted);font-size:12px}
.wc-sec{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.wc-sec h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.wc dl{display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:8px 12px;margin:0}
.wc-row{display:contents}
.wc dt{color:var(--muted);font-size:13px}
.wc dt span{display:block;font-family:var(--font-ar-ui);font-size:12px}
.wc dd{margin:0;text-align:right;min-width:0}
.wc-ar{font-family:var(--font-ar-ui);font-size:18px;direction:rtl;display:block}
.irab{margin:0;padding-right:18px;font-family:var(--font-ar-ui);font-size:17px;line-height:1.8}
.irab b{color:var(--accent)}
.wc-src{margin:0;font-size:12px}
.wpop{position:fixed;z-index:45;pointer-events:none;overflow:hidden;background:var(--sheet);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.wpop.strip{gap:4px;padding:8px 14px;border-color:var(--gold)}
.wpop.strip p{margin:0}
.ws-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.ws-word{font-family:var(--font-ar);font-size:26px;line-height:1.5;color:var(--ink)}
.ws-sarf{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--font-ar-ui);font-size:15px}
.ws-sarf small{font-family:var(--font-ui);color:var(--muted);font-size:12px}
.ws-irab{font-family:var(--font-ar-ui);font-size:15px;line-height:1.7;text-align:right}
.ws-irab b{color:var(--accent)}
footer{font-size:13px;color:var(--muted)}
footer p{margin:0 0 6px}
</style>

<header class="topbar">
  <div class="in">
    <button class="surahbtn" id="openPicker" type="button" aria-haspopup="dialog">
      <span class="num" id="tbNum">1</span>
      <span class="txt"><span class="nm" id="tbName">…</span><span class="sub" id="tbSub"></span></span>
      <span class="arn" id="tbAr" lang="ar"></span>
    </button>
    <button class="iconbtn" id="openSettings" type="button" aria-haspopup="dialog" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main id="main" aria-live="polite"><p class="meta">…</p></main>

<nav class="nav" aria-label="Mode">
  <div class="in">
    <button type="button" data-mode="listen"><svg viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg><span data-i="tabListen"></span></button>
    <button type="button" data-mode="recall"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span data-i="tabRecall"></span></button>
    <button type="button" data-mode="fade"><svg viewBox="0 0 24 24"><path d="M4 7h4M11 7h9M4 12h9M16 12h4M4 17h2M9 17h11" stroke-dasharray="0"/></svg><span data-i="tabFade"></span></button>
    <button type="button" data-mode="next"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="7" rx="2"/><rect x="13" y="4" width="8" height="7" rx="2"/><rect x="3" y="13" width="8" height="7" rx="2"/><rect x="13" y="13" width="8" height="7" rx="2"/></svg><span data-i="tabNext"></span></button>
    <button type="button" data-mode="progress"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-i="tabProgress"></span></button>
  </div>
</nav>

<div class="sheetwrap" id="picker" hidden role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
  <div class="sheet">

const gloss = k => (GLOSS[k] || [])[['en', 'ru', 'kk'].indexOf(S.lang)] || '';

  return { type: GS[x[0]], key: GS[x[1]], root: GS[x[2]], cls: GS[x[3]], bab: GS[x[4]], wazn: GS[x[5]], person: GS[x[6]], role: GS[x[7]],

/* ---------- Next word ---------- */
const norm = w => w.replace(MARKS_G, '').replace(/[ٱأإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/[۩۞]/g, '').trim();
function shuffle(arr){ for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function startQuiz(){ quiz = { list: rangeList(), ai: 0, wi: 0, opts: null, bad: new Set(), first: 0, total: 0, miss: {}, done: false }; makeOpts(); }
function makeOpts(){
  const q = quiz, v = ayah(q.list[q.ai]), right = v.w[q.wi], rn = norm(right);
  const pool = new Map();
  for (const x of surah) for (const w of x.w) { const n = norm(w); if (n && n !== rn && !pool.has(n)) pool.set(n, w); }
  if (pool.size < 3) for (const x of loadSurah(1).concat(loadSurah(112))) for (const w of x.w) { const n = norm(w); if (n !== rn && !pool.has(n)) pool.set(n, w); }
  // Prefer distractors of similar length so the answer does not stand out.
  const cands = shuffle([...pool.values()]).sort((a, b) => Math.abs(norm(a).length - rn.length) - Math.abs(norm(b).length - rn.length)).slice(0, 12);
  q.opts = shuffle([right, ...shuffle(cands).slice(0, 3)]);
  q.bad = new Set();
}
function renderNext(){
  if (!quiz) startQuiz();
  const q = quiz, pct = q.total ? Math.round(q.first / q.total * 100) : 100;
  const head = `<div class="spread"><span class="meta">${T('ayahOf', Math.min(q.ai + 1, q.list.length), q.list.length)} · ${T('firstTry', q.first, q.total, pct)}</span>
    <button class="linkbtn" id="restartQuiz" type="button">${T('startOver')}</button></div>`;
  if (q.done) {
    const weak = Object.entries(q.miss).filter(([, n]) => n > 0).map(([a]) => +a);
    return `<section class="card empty">${head}<h2>${T('rangeDone')}</h2>
      <div class="stats"><div class="stat"><b>${pct}%</b><span>${T('accuracy')}</span></div><div class="stat"><b>${q.total}</b><span>${T('wordsLbl')}</span></div><div class="stat"><b>${weak.length}</b><span>${T('withSlips')}</span></div></div>
      <p>${weak.length ? T('weakMsg', weak.join(', ')) : T('noSlips')}</p>
      ${weak.length ? `<button class="btn primary block" id="weakRecall" type="button" data-weak="${weak.join(',')}">${T('reviewWeak')}</button>` : ''}
      <button class="btn block" id="restartQuiz2" type="button">${T('goAgain')}</button></section>`;
  }
  const a = q.list[q.ai], v = ayah(a), complete = q.wi >= v.w.length, tr = trText(v);
  let html = `<section class="card">${head}${cueHTML(a)}
    <div class="answer${complete ? ' shown' : ''}"><p class="ar" lang="ar">${complete ? ayahHTML(v) : ayahHTML(v, q.wi) + (q.wi ? ' ' : '') + '<span class="slot">?</span>'}</p>
    ${complete && tr ? `<p class="tr">${esc(tr)}</p>` : ''}${complete ? `<div>${listen(v)}</div>` : ''}</div>`;
  if (complete) html += `</section><div class="dock"><div class="meta">${T('slips', q.miss[a] || 0)}</div><button class="btn primary block" id="nextAyah" type="button">${q.ai + 1 < q.list.length ? T('nextAyah') : T('results')} <kbd>Enter</kbd></button></div>`;

    <div class="dock"><div class="opts">${q.opts.map((w, i) => `<button class="opt${q.bad.has(i) ? ' bad' : ''}" data-opt="${i}" type="button" ${q.bad.has(i) ? 'disabled' : ''}><kbd>${i + 1}</kbd><span class="ar" lang="ar">${esc(w)}</span></button>`).join('')}</div></div>`;
  return html;
}
function choose(i){
  const q = quiz, a = q.list[q.ai], v = ayah(a);
  if (q.done || q.wi >= v.w.length || q.bad.has(i)) return;
  if (norm(q.opts[i]) === norm(v.w[q.wi])) {
    if (!q.bad.size) q.first++;
    q.total++; q.wi++;
    if (q.wi < v.w.length) makeOpts();
  } else { q.bad.add(i); q.miss[a] = (q.miss[a] || 0) + 1; if (navigator.vibrate) try { navigator.vibrate(40); } catch(e){} }
  render();
}
function nextAyah(){
  const q = quiz; q.ai++; q.wi = 0;
  if (q.ai >= q.list.length) q.done = true; else makeOpts();
  render(true);
}

/* ---------- events ---------- */
document.querySelector('.nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-mode]'); if (!b) return;
  S.mode = b.dataset.mode; saveUI(); render(true);
});
$('#openPicker').addEventListener('click', () => { $('#search').value = ''; renderPicker(); openSheet('#picker'); const cur = $('#surahList [aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'center' }); });
$('#openSettings').addEventListener('click', () => { renderSettings(); openSheet('#settings'); });
document.querySelectorAll('.sheetwrap').forEach(w => w.addEventListener('click', e => { if (e.target === w || e.target.closest('[data-close]')) closeSheets(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheets(); });
$('#search').addEventListener('input', renderPicker);
$('#surahList').addEventListener('click', e => {
  const b = e.target.closest('[data-pick]'); if (!b) return;
  selectSurah(+b.dataset.pick); renderPicker();
});
$('#picker').addEventListener('click', e => {
  const st = e.target.closest('[data-step]'); if (!st) return;
  const [k, d] = st.dataset.step.split(':'); const f = +$('#from').value, t = +$('#to').value;
  if (k === 'from') setRange(f + +d, Math.max(t, f + +d)); else setRange(Math.min(f, t + +d), t + +d);
});
$('#from').addEventListener('change', () => setRange(+$('#from').value, Math.max(+$('#from').value, +$('#to').value)));
$('#to').addEventListener('change', () => setRange(Math.min(+$('#from').value, +$('#to').value), +$('#to').value));
$('#whole').addEventListener('click', () => setRange(1, ch().c));

$('#settingsBody').addEventListener('click', e => {
  const b = e.target.closest('[data-set]');
  if (b) { S[b.dataset.set] = b.dataset.val; saveUI(); applyLook(); renderSettings(); render(); return; }
  const id = (e.target.closest('button') || {}).id;
  if (id === 'installBtn') install();
  else if (id === 'audioDelAll') { if (armed(e.target.closest('button'))) deleteAudio(0).then(() => { renderSettings(); updateDL(); }, () => {}); }
  else if (id === 'resetBtn') { confirmReset = true; renderSettings(); }
  else if (id === 'resetNo') { confirmReset = false; renderSettings(); }
  else if (id === 'resetYes') {
    for (const k of Object.keys(progress)) { progress[k] = {}; if (db) pending.add(k); }
    lsSet(LS_PROG, progress); flush(); confirmReset = false; session = null; renderSettings(); render(); toast(esc(T('resetDone')));
  }
  else if (id === 'exportBtn') {
    const blob = new Blob([JSON.stringify({ app: 'hifz-recall', v: 1, saved: new Date().toISOString(), progress })], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `hifz-recall-backup-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast(esc(T('backupSaved')));
  }
  else if (id === 'importBtn') $('#importFile').click();
});
$('#settingsBody').addEventListener('change', e => { if (e.target.id === 'cueTr') { S.cueTr = e.target.checked; saveUI(); render(); } });
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || d.app !== 'hifz-recall' || typeof d.progress !== 'object') throw 0;
    let n = 0;
    for (const [sid, cs] of Object.entries(d.progress)) {
      if (!chapters[+sid - 1] || typeof cs !== 'object') continue;
      const local = cardsFor(sid);
      for (const [a, c] of Object.entries(cs)) if (c && typeof c.d === 'string' && (!local[a] || (c.t || 0) > (local[a].t || 0))) { local[a] = c; n++; }
    }
    lsSet(LS_PROG, progress); session = null; render(); toast(esc(T('backupLoaded', n)));
  } catch (err) { toast(esc(T('backupBad'))); }
});

const main = $('#main');
main.addEventListener('change', e => {
  if (e.target.id === 'firstLetters') { S.firstLetters = e.target.checked; saveUI(); render(); }
  if (e.target.id === 'lsGap') { S.gap = e.target.checked; saveUI(); }
});
main.addEventListener('click', e => {
  const t = e.target;
  const pl = t.closest('[data-play]'); if (pl) return play(+pl.dataset.play);
  if (t.closest('#lsPlay')) return lpToggle();
  if (t.closest('#lsPrev')) return lpStep(-1);
  if (t.closest('#lsNext')) return lpStep(1);
  const ls = t.closest('[data-ls]');
  if (ls) {
    S[ls.dataset.ls] = +ls.dataset.val; saveUI();
    LP.el.defaultPlaybackRate = LP.el.playbackRate = S.speed;
    return render();
  }
  const lw = t.closest('.lsa [data-wi]'); if (lw) return openWord(+lw.closest('.lsa').dataset.la, +lw.dataset.wi, true);
  const la = t.closest('.lsa'); if (la) return lpStart(rangeList().indexOf(+la.dataset.la));
  if (t.closest('#dlStart')) return downloadSurah(S.surah);
  if (t.closest('#dlStop')) { if (DL) { DL.stop = true; DL.user = true; } return; }
  const del = t.closest('#dlDelete');
  if (del) { if (armed(del)) deleteAudio(S.surah).then(updateDL, () => {}); return; }
  if (t.closest('#installBtn')) return install();
  if (t.closest('#reveal')) { session.revealed = true; return render(); }
  if (t.closest('#hint')) { session.hints++; return render(); }
  const g = t.closest('.grade'); if (g) return grade(+g.dataset.g);
  if (t.closest('#againAll')) { startRecall(rangeList()); return render(true); }
  const lv = t.closest('[data-level]'); if (lv) { S.level = +lv.dataset.level; fadeShown.clear(); saveUI(); return render(); }
  if (t.closest('#reshuffle')) { S.seed = (S.seed % 9973) + 1; fadeShown.clear(); saveUI(); return render(); }
  if (t.closest('#hideAgain')) { fadeShown.clear(); return render(); }
  const gap = t.closest('.w.gap'); if (gap) return revealGap(gap);
  if (t.closest('#closeWarn')) { storeWarnClosed = true; return render(); }
  const w = t.closest('.w[data-a]'); if (w) return openWord(+w.dataset.a, +w.dataset.i);
  const o = t.closest('[data-opt]'); if (o) return choose(+o.dataset.opt);
  if (t.closest('#nextAyah')) return nextAyah();
  if (t.closest('#restartQuiz') || t.closest('#restartQuiz2')) { startQuiz(); return render(true); }
  const wk = t.closest('#weakRecall');
  if (wk) { S.mode = 'recall'; saveUI(); startRecall(wk.dataset.weak.split(',').map(Number)); return render(true); }
  const m = t.closest('[data-map]');
  if (m) { const a = +m.dataset.map; S.mode = 'recall'; setRange(a, Math.min(ch().c, a + Math.max(0, S.to - S.from))); return; }
  const d = t.closest('[data-due]');
  if (d) {
    const sid = +d.dataset.due, td = today();
    const list = Object.entries(progress[sid] || {}).filter(([, c]) => c.d <= td).map(([a]) => +a).sort((x, y) => x - y);
    S.mode = 'recall'; selectSurah(sid, list[0], list[list.length - 1]);
  }
});
if (CAN_HOVER) {
  main.addEventListener('mouseover', e => { const w = wordTarget(e.target); if (!w || w === popFor) return; clearTimeout(popTimer); popTimer = setTimeout(() => showPop(w), 350); });
  main.addEventListener('mouseout', e => { if (wordTarget(e.target) && !wordTarget(e.relatedTarget)) { clearTimeout(popTimer); popTimer = setTimeout(hidePop, 250); } });
  addEventListener('scroll', hidePop, { passive: true });
  addEventListener('resize', hidePop);
}
$('#wordBody').addEventListener('click', e => { const b = e.target.closest('#wcPlay'); if (b) { closeSheets(); lpStart(rangeList().indexOf(+b.dataset.a)); } });
main.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('gap')) { e.preventDefault(); revealGap(e.target); }
  if (e.key === 'Enter' && e.target.classList.contains('lsa')) { e.preventDefault(); lpStart(rangeList().indexOf(+e.target.dataset.la)); }
});
document.addEventListener('keydown', e => {
  if (!surah || e.ctrlKey || e.metaKey || e.altKey || !$('#picker').hidden || !$('#settings').hidden) return;
  if (/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(e.target.tagName) && e.key !== 'h' && !/^[1-4]$/.test(e.key)) return;
  if (S.mode === 'listen' && e.key === ' ' && !/^(INPUT|BUTTON)$/.test(e.target.tagName)) { e.preventDefault(); lpToggle(); }
  else if (S.mode === 'recall' && session && session.idx < session.queue.length) {
    if (!session.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); session.revealed = true; render(); }
    else if (!session.revealed && (e.key === 'h' || e.key === 'H')) { if (session.hints < ayah(session.queue[session.idx]).w.length) { session.hints++; render(); } }
    else if (session.revealed && /^[1-4]$/.test(e.key)) grade(+e.key - 1);
  } else if (S.mode === 'next' && quiz && !quiz.done) {
    if (quiz.wi >= ayah(quiz.list[quiz.ai]).w.length && e.key === 'Enter') { e.preventDefault(); nextAyah(); }
    else if (/^[1-4]$/.test(e.key) && +e.key <= quiz.opts.length) choose(+e.key - 1);
  }
});

/* ---------- boot ---------- */
if (!chapters[S.surah - 1]) S.surah = 1;
if (!L[S.lang]) S.lang = 'kk';
applyLook();
selectSurah(S.surah, S.from, S.to);
if (IN_CLAUDE) initCloud();
else addEventListener('load', () => { if (window.claude && window.claude.use) { IN_CLAUDE = true; render(); initCloud(); } });
})();
</script>
